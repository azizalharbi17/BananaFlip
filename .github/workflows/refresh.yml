name: Refresh coin data

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/refresh
        run: |
          # Canonical www host on purpose: the apex bananaflip.io 308-
          # redirects to www, and curl neither follows it here nor would
          # resend the bearer across the cross-host hop — so a POST to the
          # apex was silently dropped, leaving prices stale for days.
          curl -fsS -X POST "https://www.bananaflip.io/api/refresh" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            --max-time 120
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
