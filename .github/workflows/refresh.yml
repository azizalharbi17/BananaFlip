name: Refresh coin data

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/refresh
        run: |
          curl -fsS -X POST "https://bananaflip.io/api/refresh" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            --max-time 120
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
